# Isolated Kong OSS 1.5.1 evidence (host network) for KP-004/006/007 live proxy slices.
# Host networking avoids broken Docker bridge DNS (198.18.0.0/15 interception on this runner).
# Never merge into production overlays. Profile: live-kong-evidence.
services:
  live-kong-db:
    profiles: [live-kong-evidence]
    image: postgres:11-alpine
    network_mode: host
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
      POSTGRES_HOST_AUTH_METHOD: trust
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes: [live_kong_pgdata:/var/lib/postgresql/data]
    command: ["postgres", "-c", "listen_addresses=127.0.0.1", "-p", "25432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -p 25432 -U kong -d kong"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"

  live-kong-migrations:
    profiles: [live-kong-evidence]
    image: kong:1.5.1
    network_mode: host
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: 127.0.0.1
      KONG_PG_PORT: "25432"
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_ANONYMOUS_REPORTS: "off"
    command: ["kong", "migrations", "bootstrap"]
    depends_on:
      live-kong-db: {condition: service_healthy}
    restart: "no"

  live-upstream:
    profiles: [live-kong-evidence]
    image: hashicorp/http-echo:1.0
    network_mode: host
    command: ["-text=kongpilot-live-upstream-ok", "-listen=0.0.0.0:25678"]
    restart: "no"

  live-kong:
    profiles: [live-kong-evidence]
    image: kong:1.5.1
    network_mode: host
    user: kong
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: 127.0.0.1
      KONG_PG_PORT: "25432"
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_ANONYMOUS_REPORTS: "off"
      KONG_NGINX_WORKER_PROCESSES: "1"
      KONG_PROXY_LISTEN: 127.0.0.1:18000
      KONG_ADMIN_LISTEN: 127.0.0.1:18001
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_ERROR_LOG: /dev/stderr
    depends_on:
      live-kong-db: {condition: service_healthy}
      live-kong-migrations: {condition: service_completed_successfully}
      live-upstream: {condition: service_started}
    healthcheck:
      test: [CMD, kong, health]
      interval: 5s
      timeout: 5s
      start_period: 25s
      retries: 15
    restart: "no"

volumes:
  live_kong_pgdata: {}
