# Base docker-compose.yml + this file; never add compose.development.yml.
# TLS terminates at each web container, so the BFF sees real $scheme=https.
x-production-logging: &production-logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  console-api:
    image: ${KONGOS_API_IMAGE:?Set the frozen API release image}
    user: "1000:1000"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777"]
    pids_limit: 128
    mem_limit: 1g
    cpus: "2"
    logging: *production-logging
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "true"
      PUBLIC_ORIGINS: ${PUBLIC_ORIGINS:?Set explicit HTTPS Console origins}
      PORTAL_PUBLIC_ORIGINS: ${PORTAL_PUBLIC_ORIGINS:?Set independent HTTPS Portal origins}
      TRUST_PROXY: "1"
  console-migrations:
    image: ${KONGOS_API_IMAGE:?Set the same frozen API release image}
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777"]
    pids_limit: 128
    mem_limit: 512m
    logging: *production-logging
  console-web:
    image: ${KONGOS_WEB_IMAGE:?Set the frozen Console web release image}
    user: "101:101"
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777"]
    pids_limit: 64
    mem_limit: 256m
    logging: *production-logging
    ports: !override
      - "${KONGOS_HTTPS_BIND_IP:-127.0.0.1}:${CONSOLE_HTTPS_PORT:?Set Console HTTPS port}:8443"
    volumes:
      - ./deploy/nginx/console-production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${KONGOS_CONSOLE_TLS_DIRECTORY:?Set a dedicated Console TLS directory}:/run/kongos-tls:ro
  portal-web:
    image: ${KONGOS_PORTAL_IMAGE:?Set the frozen independent Portal release image}
    pids_limit: 64
    mem_limit: 256m
    logging: *production-logging
    ports: !override
      - "${KONGOS_HTTPS_BIND_IP:-127.0.0.1}:${PORTAL_HTTPS_PORT:?Set Portal HTTPS port}:8443"
    volumes:
      - ./deploy/nginx/portal-production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${KONGOS_PORTAL_TLS_DIRECTORY:?Set a dedicated Portal TLS directory}:/run/kongos-tls:ro
  kong:
    pids_limit: 512
    mem_limit: 1g
    cpus: "2"
    environment:
      # Kong 1.5 "auto" spawns one worker per host core (~240 MiB each); on an 8-core host
      # the 1 GiB limit OOM-kills workers and the Admin API returns empty replies. Match cpus.
      KONG_NGINX_WORKER_PROCESSES: "${KONG_NGINX_WORKER_PROCESSES:-2}"
    logging: *production-logging
  kong-db:
    pids_limit: 256
    mem_limit: 512m
    logging: *production-logging
  kong-migrations:
    logging: *production-logging
  console-db:
    pids_limit: 256
    mem_limit: 512m
    logging: *production-logging
  redis:
    pids_limit: 64
    mem_limit: 256m
    logging: *production-logging
