limit_req_zone $binary_remote_addr zone=kongos_portal:10m rate=20r/s;
log_format kongos_portal_safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
server {
    listen 8443 ssl;
    ssl_certificate /run/kongos-tls/tls.crt;
    ssl_certificate_key /run/kongos-tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;
    server_name _;
    server_tokens off;
    access_log /dev/stdout kongos_portal_safe;
    error_log /dev/null;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location ^~ /api/v1/portal/ {
        limit_req zone=kongos_portal burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://console-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }
    location ^~ /api/ { return 404; }
    location = /api { return 404; }
    location ~ ^/(?:scrape|catalog|ingest|metrics|swagger|admin)(?:/|$) { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}

# Local readiness only: the public API is served exclusively through TLS.
server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    error_log /dev/null;
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location / { return 404; }
}
