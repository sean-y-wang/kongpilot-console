limit_req_zone $binary_remote_addr zone=kongos_api:10m rate=20r/s;
# OAuth callbacks contain one-time codes/state in query strings. Neither
# query strings nor request headers/body belong in the reverse-proxy log.
log_format kongos_safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log /dev/stdout kongos_safe;
    # Native request-context errors may repeat the original URI/query even
    # after access-log sanitizing (e.g. throttling/upstream failures).
    error_log /dev/null;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    # Portal cookies are scoped by path, not TCP port. Public/private Portal
    # endpoints are available only on the independent Portal edge.
    location ^~ /api/v1/portal/ { return 404; }
    # BEGIN M8 bounded operation waits: exact paths and methods only.
    # Shared GET list / POST capture route: preserve method and body in
    # the internal POST-only redirect; ordinary reads retain35-second waits.
    location ~ "^/api/v1/clusters/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}/snapshots$" {
        error_page 418 = @m8_snapshot_capture;
        if ($request_method = POST) { return 418; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        limit_req zone=kongos_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://console-api:3000;
        proxy_hide_header X-Content-Type-Options;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replace incoming XFF, so clients cannot choose their source IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }
    location @m8_snapshot_capture {
        if ($request_method != POST) { return 405; }
        limit_req zone=kongos_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://console-api:3000;
        proxy_hide_header X-Content-Type-Options;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replace incoming XFF, so clients cannot choose their source IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
    }
    location ~ "^/api/v1/clusters/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}/(?:snapshots/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}/(?:export|rollback-plan)|configuration/(?:imports|exports|plans/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}/(?:apply|reconcile)|exports/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}/download)|workflows/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}/execute)$" {
        if ($request_method != POST) { return 405; }
        limit_req zone=kongos_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://console-api:3000;
        proxy_hide_header X-Content-Type-Options;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replace incoming XFF, so clients cannot choose their source IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
    }
    location ~ "^/api/v1/clusters/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}/snapshots/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}/compare/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$" {
        if ($request_method != GET) { return 405; }
        limit_req zone=kongos_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://console-api:3000;
        proxy_hide_header X-Content-Type-Options;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replace incoming XFF, so clients cannot choose their source IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
    }
    # END M8 bounded operation waits.
    location /api/ {
        limit_req zone=kongos_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://console-api:3000;
        proxy_hide_header X-Content-Type-Options;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replace incoming XFF, so clients cannot choose their source IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
