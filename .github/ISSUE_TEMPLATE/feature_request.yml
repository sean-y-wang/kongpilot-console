name: Feature request / 功能建议
description: Suggest an idea / 提出新想法
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem / 要解决的问题}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposal / 建议方案}
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes: {label: Alternatives considered / 其他方案}
