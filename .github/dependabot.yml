version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directories: [/apps/console-api, /apps/console-web, /apps/portal-web]
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
